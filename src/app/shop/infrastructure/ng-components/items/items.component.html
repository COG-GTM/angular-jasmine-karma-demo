<div class="items-container">
  <h2>Items Shop</h2>
  
  <div class="sort-controls">
    <span>Sort by:</span>
    <button mat-button (click)="onSortChange('name')" [class.active]="sortCriteria === 'name'">
      Name {{ sortCriteria === 'name' ? (sortDirection === 'asc' ? '↑' : '↓') : '' }}
    </button>
    <button mat-button (click)="onSortChange('price')" [class.active]="sortCriteria === 'price'">
      Price {{ sortCriteria === 'price' ? (sortDirection === 'asc' ? '↑' : '↓') : '' }}
    </button>
    <button mat-button (click)="onSortChange('description')" [class.active]="sortCriteria === 'description'">
      Description {{ sortCriteria === 'description' ? (sortDirection === 'asc' ? '↑' : '↓') : '' }}
    </button>
  </div>

  <div class="items-grid">
    <app-item *ngFor="let item of items"
      [name]="item.name"
      [description]="item.description"
      [price]="item.price">
    </app-item>
  </div>
</div>
